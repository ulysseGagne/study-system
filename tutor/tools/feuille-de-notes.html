<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feuille de notes · impression</title>
<!-- Lays out a note sheet in Markdown (?md=/<course>/evaluations/<exam>/<sheet>.md, served by serve.py) on letter pages, three columns, small type.
     Made for IFT-2006's intra (October 2026); the method: preparing-for-an-exam.md, §4.1.
     Leaves out « Mode d'emploi », the byline and the « → questions » lines. ?pt=6.5 changes the type size.
     The banner (not printed) says how many sides the content fills and how many words fit on two. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  @page { size: letter; margin: 0.25in; }
  :root { --pt: 7pt; --gap: 0.14in; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
  #info { font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; padding: 10px 12px; background: #eef2ff; border-bottom: 1px solid #c7d2fe; }
  .page { width: 8in; height: 10.5in; columns: 3; column-gap: var(--gap); column-rule: 0.5pt solid #bbb; column-fill: auto;
          font-size: var(--pt); line-height: 1.17; margin: 0.25in; box-sizing: border-box; }
  h1 { display: none; }
  h2 { font-size: 1.2em; margin: 0.35em 0 0.15em; padding: 0.05em 0.25em; background: #000; color: #fff; break-after: avoid; }
  h3 { font-size: 1.04em; margin: 0.35em 0 0.08em; border-bottom: 0.5pt solid #000; break-after: avoid; }
  p, ul, ol { margin: 0.08em 0; }
  ul, ol { padding-left: 1em; }
  li { margin: 0; }
  li > ul, li > ol { margin: 0; }
  table { border-collapse: collapse; width: 100%; margin: 0.12em 0; break-inside: avoid; }
  th, td { border: 0.4pt solid #888; padding: 0.03em 0.18em; vertical-align: top; text-align: left; }
  th { background: #eee; }
  code { font-family: Menlo, monospace; font-size: 0.9em; }
  #sheet { position: absolute; left: -100in; top: 0; }                /* measuring copy, off screen */
  .ppage { overflow: hidden; outline: 1px solid #c7d2fe; }
  @media print { #info, #sheet { display: none; } .page { margin: 0; } .ppage { outline: none; break-after: page; } }
</style>
</head>
<body>
<div id="info">Chargement de la feuille…</div>
<div class="page" id="sheet"></div>
<script>
(async () => {
  const pt = new URLSearchParams(location.search).get('pt');
  if (pt) document.documentElement.style.setProperty('--pt', pt + 'pt');
  const src = new URLSearchParams(location.search).get('md');
  let md = await (await fetch(src, {cache: 'no-store'})).text();
  md = md.replace(/^---[\s\S]*?\n---\n/, '');                       // front matter
  md = md.replace(/^> Copie Markdown[^\n]*\n/m, '');                  // note about the snapshot
  md = md.replace(/^## Mode d'emploi[\s\S]*?(?=^## )/m, '');          // instructions for the review day
  md = md.replace(/^[A-Z][a-z]{2} \d{1,2}, \d{4} · @[^\n]*\n/m, '');  // byline
  md = md.replace(/^→[^\n]*\n/gm, '');                                // question lists
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = marked.parse(md);
  await document.fonts.ready;
  const gap = parseFloat(getComputedStyle(sheet).columnGap);
  const colWidth = (sheet.clientWidth - 2 * gap) / 3;
  const columns = Math.round((sheet.scrollWidth + gap) / (colWidth + gap));
  const sides = columns / 3;
  const words = (sheet.innerText.match(/\S*[\p{L}\p{N}]\S*/gu) || []).length;
  const fits = Math.round(words * 2 / sides);
  // Print pages: move the blocks one by one into letter pages; a list that doesn't fit is split by items,
  // a heading never ends a page, a table moves whole.
  const overflows = p => p.scrollWidth > p.clientWidth + 2;
  const newPage = () => { const p = document.createElement('div'); p.className = 'page ppage'; document.body.appendChild(p); return p; };
  let page = newPage();
  for (const block of [...sheet.children].map(b => b.cloneNode(true))) {
    page.appendChild(block);
    if (!overflows(page)) continue;
    page.removeChild(block);
    if ((block.tagName === 'UL' || block.tagName === 'OL') && block.children.length > 1) {
      const head = block.cloneNode(false); page.appendChild(head);
      while (block.firstElementChild) {
        head.appendChild(block.firstElementChild);
        if (overflows(page)) { block.insertBefore(head.lastElementChild, block.firstElementChild); break; }
      }
      if (!head.children.length) page.removeChild(head);
    }
    const carry = [];
    while (page.lastElementChild && /^H[1-6]$/.test(page.lastElementChild.tagName)) carry.unshift(page.removeChild(page.lastElementChild));
    page = newPage();
    for (const h of carry) page.appendChild(h);
    if (block.children.length || !['UL', 'OL'].includes(block.tagName)) page.appendChild(block);
  }
  const printed = document.querySelectorAll('.ppage').length;
  document.getElementById('info').textContent =
    `${getComputedStyle(sheet).fontSize} · ${words} mots · ${sides.toFixed(2)} faces · ` +
    `deux faces tiennent environ ${fits} mots · contenu = ${(sides / 2).toFixed(2)} × la feuille · ` +
    `impression : ${printed} page${printed > 1 ? 's' : ''}${printed > 2 ? ' (trop : couper avant d\'imprimer)' : ' (OK : Cmd+P, recto-verso)'}`;
  window.__mesure = {words, columns, sides, fits, printed};
})();
</script>
</body>
</html>
